name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: svelte-check
        run: bun run check

  lint:
    name: biome
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: biome ci
        run: bunx biome ci .
      - name: published package stays utility-CSS-free
        run: |
          if grep -rnE 'class="[^"]*(px-|py-|bg-|text-(white|xs|sm|left|red|blue)|rounded|flex |w-full|border-|hover:|absolute|fixed|inset-0|opacity-|shadow|ml-|mt-|mb-|min-w-)' src/lib/; then
            echo "::error::Utility-CSS class names found in src/lib — the published package must remain self-contained (scoped CSS only)."
            exit 1
          fi

  test:
    name: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # WYSIWYG tests + Storybook tests both run in Chromium via Playwright.
      # --with-deps pulls libnss3/libatk-bridge/etc. that ubuntu-latest lacks.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: vitest --run
        run: bun run test

  build:
    name: package build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: svelte-package + publint
        run: bun run build
      - name: demo site build
        run: bun run build:site
